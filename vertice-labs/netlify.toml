[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache de assets (1h — seguro durante iteração)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# LP Advocacia (serve o index da pasta em /advocacia)
[[redirects]]
  from = "/advocacia"
  to = "/advocacia/index.html"
  status = 200
  force = true

[[redirects]]
